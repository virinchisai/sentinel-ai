[project]
name = "sentinel-ai"
version = "2.0.0"
description = "SentinelAI — Secure Enterprise AI Workspace. An MCP-powered platform connecting employees to internal knowledge, source code, email, calendar, and operational tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
    "openai>=1.54.0",
    "PyJWT[crypto]>=2.10",
    "cryptography>=44",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.12",
    "PyMuPDF>=1.24.0",
    "slowapi>=0.1.9",
    "email-validator>=2.2",
    "bcrypt>=4",
    "psycopg2-binary>=2.9",
    "sqlglot>=26",
]

[project.optional-dependencies]
observability = ["langfuse>=3.3,<5"]
docling = ["docling>=2"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.setuptools.package-data]
backend = ["rag/sample_docs/*.md"]
evaluation = ["dataset.jsonl"]
