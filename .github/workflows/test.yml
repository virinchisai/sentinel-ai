name: tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: pytest backend/tests -q
      - run: PYTHONPATH=. python scripts/benchmark.py
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-benchmark-${{ matrix.python }}
          path: evaluation/results/benchmark.json
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: sentinel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://sentinel:test-only-ci@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: PYTHONPATH=. python scripts/postgres_smoke.py
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile.backend -t sentinel-api:test .
      - run: docker build -f docker/Dockerfile.frontend -t sentinel-ui:test .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: npm ci --prefix frontend
      - name: Start local test services
        run: |
          python -m uvicorn backend.api.main:app --host 127.0.0.1 --port 8000 > /tmp/sentinel-api.log 2>&1 &
          npm --prefix frontend run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/sentinel-ui.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://localhost:8000/health', 'http://localhost:3000/register']:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit('Service failed to start: ' + url)
          PY
      - run: bash scripts/browser-smoke.sh
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: |
            .playwright-cli/
            /tmp/sentinel-api.log
            /tmp/sentinel-ui.log
